<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.bigdatacloud.net https://nominatim.openstreetmap.org https://api.allorigins.win https://servicodados.ibge.gov.br https://economia.awesomeapi.com.br https://api.gold-api.com https://query1.finance.yahoo.com https://api.coinbase.com https://metalmetric.com https://mintedmetal.com; worker-src 'self' blob:; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Minera Pará - Estoque</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20261009s">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261009s">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20261009s">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div class="brand-title">
                <h1>Minera Pará</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card">
            <h2>Estoque de materiais</h2>
            <div id="estoque-lista" class="loading">Carregando...</div>
        </section>

        <section class="card">
            <h2>Adicionar material</h2>
            <form id="form-estoque">
                <label for="tipo_material">Tipo de material</label>
                <input type="text" id="tipo_material" placeholder="Ex: Brita 1" required>
                <label for="peso_atual_kg">Peso atual (kg)</label>
                <input type="number" id="peso_atual_kg" step="0.01" min="0" required>
                <label for="localizacao">Localização</label>
                <input type="text" id="localizacao" placeholder="Ex: Pátio A">
                <button type="submit">Salvar no estoque</button>
            </form>
            <p id="estoque-msg" class="msg"></p>
        </section>
    </div>
    <script src="config.js?v=20261009s"></script>
    <script src="seguranca.js?v=20261009s"></script>
    <script src="auth-guard.js?v=20261009s"></script>
    <script src="suporte.js?v=20261009s"></script>
    <script src="chat-realtime.js?v=20261009s"></script>
    <script src="avatar.js?v=20261009s"></script>
    <script src="nav.js?v=20261009s"></script>
    <script src="estoque.js?v=20261009s"></script>
    <script src="pwa.js?v=20261009s"></script>
</body>
</html>
