<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera App - Expedição</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260918b">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260918b">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f59e0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera">
    <link rel="stylesheet" href="style.css?v=20260918b">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div class="brand-title">
                <h1>Minera App</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card">
            <h2>Expedições</h2>
            <div id="exp-lista" class="loading">Carregando...</div>
        </section>

        <section class="card">
            <h2>Nova expedição</h2>
            <form id="form-exp">
                <label for="exp_lote_id">Lote (opcional)</label>
                <select id="exp_lote_id"><option value="">—</option></select>
                <label for="exp_estoque_id">Estoque (opcional)</label>
                <select id="exp_estoque_id"><option value="">—</option></select>
                <label for="quantidade_kg">Quantidade (kg)</label>
                <input type="number" id="quantidade_kg" step="0.01" min="0" required>
                <label for="destino">Destino</label>
                <input type="text" id="destino" required placeholder="Cliente / obra">
                <label for="nota_fiscal">Nota fiscal</label>
                <input type="text" id="nota_fiscal" placeholder="NF-e">
                <label for="valor_total">Valor total (R$)</label>
                <input type="number" id="valor_total" step="0.01" min="0">
                <button type="submit">Registrar expedição</button>
            </form>
            <p id="exp-msg" class="msg"></p>
        </section>
    </div>
    <script src="config.js?v=20260918b"></script>
    <script src="auth-guard.js?v=20260918b"></script>
    <script src="suporte.js?v=20260918b"></script>
    <script src="nav.js?v=20260918b"></script>
    <script src="expedicao.js?v=20260918b"></script>
    <script src="pwa.js?v=20260918b"></script>
</body>
</html>
