<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera App - Chat</title>
    <link rel="stylesheet" href="style.css?v=20260916o">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div>
                <h1>Minera App</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card chat-card">
            <h2>Chat da equipe</h2>
            <p id="chat-lote-ctx" class="sub oculto"></p>
            <div id="chat-msgs" class="chat-msgs"></div>

            <div class="chat-toolbar">
                <label class="btn-sm" for="chat-foto">📷 Foto</label>
                <input type="file" id="chat-foto" accept="image/*" class="oculto">
                <label class="btn-sm" for="chat-video">🎬 Vídeo</label>
                <input type="file" id="chat-video" accept="video/*" class="oculto">
                <button type="button" class="btn-sm" id="btn-audio">🎙️ Áudio</button>
                <input type="file" id="chat-audio-file" accept="audio/*" class="oculto">
                <button type="button" class="btn-sm" id="btn-toggle-agendar">🗓️ Agendar</button>
            </div>
            <p id="chat-anexo-info" class="hint oculto"></p>

            <div id="chat-agendar-box" class="chat-agendar-row oculto">
                <div style="flex:1">
                    <label for="chat-agendar-em">Enviar em</label>
                    <input type="datetime-local" id="chat-agendar-em">
                </div>
            </div>

            <div class="chat-extra">
                <div style="flex:1;min-width:160px">
                    <label for="chat-url-midia">Ou cole URL da mídia</label>
                    <input type="url" id="chat-url-midia" placeholder="https://... (opcional)">
                </div>
            </div>

            <form id="form-chat" class="chat-form" style="margin-top:8px">
                <input type="text" id="chat-texto" placeholder="Escreva uma mensagem..." maxlength="2000" autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
            <p id="chat-msg" class="msg"></p>
            <p class="hint">Canal geral · poll 4s · Admin vê tudo. Bucket Storage: chat-midia (opcional).</p>
        </section>
    </div>
    <script src="config.js?v=20260916o"></script>
    <script src="auth-guard.js?v=20260916o"></script>
    <script src="nav.js?v=20260916o"></script>
    <script src="anti-golpe.js?v=20260916o"></script>
    <script src="chat.js?v=20260916o"></script>
</body>
</html>
