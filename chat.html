<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Minera Chat</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20261001d">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261001d">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20261001d">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="pagina-chat">
    <div class="container wide">
        <p id="user-label" class="oculto"></p>
        <nav id="app-nav" class="nav-chips oculto"></nav>

        <section class="card chat-wa-layout" id="chat-wa" style="border:0;background:transparent;box-shadow:none;padding:0;margin:0">
            <aside class="chat-contacts-pane" id="chat-contacts-pane">
                <div class="wa-list-head">
                    <button type="button" class="wa-circ-btn" id="btn-chat-menu-list" aria-label="Menu">⋮</button>
                    <div class="wa-head-right">
                        <button type="button" class="wa-circ-btn" id="btn-chat-cam" aria-label="Câmera">📷</button>
                        <button type="button" class="wa-circ-btn accent" id="btn-add-contato" aria-label="Nova conversa">＋</button>
                    </div>
                </div>
                <h1 class="wa-title">Conversas</h1>
                <input type="search" id="chat-busca-contatos" class="wa-search" placeholder="Buscar ou pesquisar…" autocomplete="off">
                <div class="wa-chips" id="wa-filter-chips" role="group" aria-label="Filtros">
                    <button type="button" class="wa-chip on" data-wa="todas">Todas</button>
                    <button type="button" class="wa-chip" data-wa="nao_lidas">Não lidas</button>
                </div>
                <div id="chat-contatos-list" class="chat-contatos-list"></div>
            </aside>

            <div class="chat-thread-pane" id="chat-thread-pane">
                <div id="chat-thread-empty" class="chat-thread-empty">
                    <img class="brand-logo-lg chat-empty-logo" src="logo-escavadeira.png?v=20261001d" alt="" width="96" height="96" decoding="async">
                    <p class="chat-empty-title">Minera Chat</p>
                    <p>Selecione uma conversa.</p>
                </div>
                <div id="chat-thread-active" class="chat-thread-active oculto" data-build="20261001d">
                    <div class="wa-thread-head chat-thread-head gk-head" data-build="20261001d">
                        <button type="button" class="gk-circ gk-back chat-back" id="btn-chat-back" aria-label="Voltar para as conversas"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wa-back-unread oculto" id="chat-back-unread" aria-hidden="true"></span></button>
                        <button type="button" class="gk-pill" id="btn-chat-menu" aria-label="Opções da conversa" aria-haspopup="menu">
                            <span class="gk-av-wrap"><span class="wa-av wa-av-thread" id="chat-com-av" aria-hidden="true">?</span><span class="gk-dot oculto" id="chat-com-online" aria-hidden="true"></span></span>
                            <span class="gk-pill-txt"><strong id="chat-com-nome" class="wa-thread-name">—</strong><span id="chat-com-status" class="wa-thread-status" hidden aria-live="polite"></span></span>
                        </button>
                        <button type="button" class="gk-circ gk-amigos" id="btn-chat-amigos" aria-label="Amigos"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 13.6c2.6.2 4.5 2 4.5 4.9"/></g></svg></button>
                    </div>
                    <div id="chat-head-menu" class="chat-head-menu oculto" role="menu">
                        <button type="button" role="menuitem" id="btn-apagar-hist-mim">Apagar conversa para mim</button>
                        <button type="button" role="menuitem" id="btn-apagar-hist-todos" class="danger">Apagar histórico para todos…</button>
                    </div>
                    <p id="chat-lote-ctx" class="sub oculto"></p>
                    <div id="chat-msgs" class="chat-msgs"></div>
                    <button type="button" id="chat-jump" class="chat-jump oculto" aria-label="Ir para as mensagens mais recentes">↓<span class="chat-jump-n oculto"></span></button>

                    <div id="chat-rec-bar" class="chat-rec-bar wa-rec-overlay oculto" role="status" aria-live="polite">
                        <span class="rec-dot" aria-hidden="true"></span>
                        <span id="chat-rec-timer" class="chat-rec-timer">00:00</span>
                        <span class="chat-rec-wave" aria-hidden="true">〰〰〰</span>
                        <button type="button" class="btn-sm btn-danger" id="btn-cancel-rec">Deslize p/ cancelar</button>
                    </div>

                    <div id="chat-media-preview" class="chat-media-preview oculto"></div>
                    <p id="chat-anexo-info" class="hint oculto"></p>

                    <div id="chat-agendar-box" class="chat-agendar-row oculto">
                        <div style="flex:1">
                            <label for="chat-agendar-em">Enviar em</label>
                            <input type="datetime-local" id="chat-agendar-em">
                        </div>
                    </div>

                    <div id="chat-reply-bar" class="chat-reply-bar oculto" aria-live="polite">
                        <div class="chat-reply-bar-body">
                            <span class="chat-reply-bar-label">Respondendo</span>
                            <span id="chat-reply-snippet" class="chat-reply-snippet"></span>
                        </div>
                        <button type="button" class="chat-reply-cancel" id="btn-cancel-reply" title="Cancelar resposta" aria-label="Cancelar resposta">×</button>
                    </div>

                    <form id="form-chat" class="wa-composer chat-form gk-composer">
                        <button type="button" class="gk-circ wa-comp-plus" id="btn-chat-plus" aria-label="Anexar">＋</button>
                        <div class="wa-comp-pill gk-comp-pill">
                            <textarea id="chat-texto" rows="1" class="wa-comp-input" placeholder="Mensagem…" maxlength="4000" autocomplete="off" enterkeyhint="enter"></textarea>
                            <button type="button" class="gk-in-btn mic" id="btn-audio" title="Segure para gravar" aria-label="Gravar áudio (segure)"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></g></svg></button>
                            <button type="submit" class="gk-in-btn send" id="btn-chat-enviar" aria-label="Enviar" title="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                        </div>
                        <input type="file" id="chat-foto" accept="image/*" capture="environment" class="oculto">
                        <input type="file" id="chat-video" accept="video/*" class="oculto">
                        <input type="file" id="chat-audio-file" accept="audio/*" class="oculto">
                        <input type="file" id="chat-doc" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,application/pdf,image/*" class="oculto">
                    </form>
                    <!-- legacy toolbar hooks (hidden) -->
                    <div class="chat-toolbar oculto" aria-hidden="true">
                        <button type="button" id="btn-toggle-agendar">Agendar</button>
                        <label for="chat-audio-file" id="btn-anexar-audio">Anexo</label>
                    </div>
                    <div class="chat-extra oculto" aria-hidden="true">
                        <input type="url" id="chat-url-midia" placeholder="https://...">
                    </div>
                    <p id="chat-msg" class="msg"></p>
                </div>
            </div>
        </section>
    </div>

    <div id="modal-add-contato" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modal-add-titulo">
        <div class="modal-backdrop" data-close-add="1"></div>
        <div class="modal-panel chat-add-panel">
            <h3 id="modal-add-titulo">Adicionar por nome</h3>
            <label for="add-busca">Buscar por nome ou apelido</label>
            <input type="search" id="add-busca" placeholder="Digite o nome..." autocomplete="off">
            <div class="chat-add-roles" id="add-role-filters"></div>
            <div id="add-diretorio" class="chat-diretorio-list"></div>
            <p class="hint">Por segurança, e-mails de outros usuários nunca aparecem no chat.</p>
            <p id="add-contato-msg" class="msg"></p>
            <button type="button" class="btn-ghost" id="btn-fechar-add">Fechar</button>
        </div>
    </div>

    <div id="chat-msg-sheet" class="chat-msg-sheet oculto" role="dialog" aria-modal="true" aria-label="Ações da mensagem">
        <div class="chat-msg-sheet-backdrop" data-close-sheet="1"></div>
        <div class="chat-msg-sheet-panel">
            <div class="chat-msg-sheet-handle" aria-hidden="true"></div>
            <p id="chat-msg-sheet-preview" class="chat-msg-sheet-preview"></p>
            <button type="button" class="chat-msg-sheet-item" id="sheet-responder">↩ Responder</button>
            <button type="button" class="chat-msg-sheet-item" id="sheet-apagar-mim">Apagar para mim</button>
            <button type="button" class="chat-msg-sheet-item danger oculto" id="sheet-apagar-todos">Apagar para todos</button>
            <button type="button" class="chat-msg-sheet-item ghost" id="sheet-cancelar" data-close-sheet="1">Cancelar</button>
        </div>
    </div>

    <div id="chat-amigos-sheet" class="chat-msg-sheet oculto gk-amigos-sheet" role="dialog" aria-modal="true" aria-labelledby="amigos-titulo">
        <div class="chat-msg-sheet-backdrop" data-close-amigos="1"></div>
        <div class="chat-msg-sheet-panel">
            <div class="chat-msg-sheet-handle" aria-hidden="true"></div>
            <div class="gk-amigos-top"><p id="amigos-titulo" class="gk-amigos-title">Amigos</p><button type="button" class="btn-sm" id="btn-amigos-add">＋ Adicionar</button></div>
            <input type="search" id="amigos-busca" class="wa-search" placeholder="Buscar por nome ou apelido…" autocomplete="off">
            <div id="amigos-lista" class="gk-amigos-lista"></div>
            <button type="button" class="btn-ghost" data-close-amigos="1">Fechar</button>
        </div>
    </div>

    <div id="wa-attach-sheet" class="chat-msg-sheet oculto wa-attach-sheet" role="dialog" aria-modal="true" aria-label="Anexar">
        <div class="chat-msg-sheet-backdrop" data-close-attach="1"></div>
        <div class="chat-msg-sheet-panel">
            <div class="chat-msg-sheet-handle" aria-hidden="true"></div>
            <p style="font-weight:800;margin-bottom:8px">Anexar</p>
            <div class="wa-attach-grid">
                <label class="wa-attach-item" for="chat-foto-gal"><span class="ai">🖼</span>Galeria</label>
                <label class="wa-attach-item" for="chat-foto"><span class="ai">📷</span>Câmera</label>
                <label class="wa-attach-item" for="chat-doc"><span class="ai">📄</span>Documento</label>
                <label class="wa-attach-item" for="chat-video"><span class="ai">🎬</span>Vídeo</label>
                <label class="wa-attach-item" for="chat-audio-file"><span class="ai">🎵</span>Áudio</label>
                <button type="button" class="wa-attach-item" id="btn-attach-agendar" data-att="agendar"><span class="ai">🗓</span>Agendar</button>
            </div>
            <input type="file" id="chat-foto-gal" accept="image/*" class="oculto">
            <button type="button" class="btn-ghost" data-close-attach="1">Fechar</button>
        </div>
    </div>

    <script src="config.js?v=20261001d"></script>
    <script src="auth-guard.js?v=20261001d"></script>
    <script src="suporte.js?v=20261001d"></script>
    <script src="chat-realtime.js?v=20261001d"></script>
    <script src="nav.js?v=20261001d"></script>
    <script src="anti-golpe.js?v=20261001d"></script>
    <script src="chat-store.js?v=20261001d"></script>
    <script src="chat-midia.js?v=20261001d"></script>
    <script src="chat.js?v=20261001d"></script>
    <script src="lightbox.js?v=20261001d"></script>
    <script src="pwa.js?v=20261001d"></script>
    <script>
    (function waChrome() {
        function toast(t) { if (typeof toastMsg === 'function') toastMsg(t); }
        const cam = document.getElementById('btn-chat-cam');
        if (cam) cam.addEventListener('click', function () {
            if (typeof contatoAtivo === 'undefined' || !contatoAtivo || !contatoAtivo.auth_id) { toast('Abra uma conversa para enviar foto.'); return; }
            const f = document.getElementById('chat-foto'); if (f) f.click();
        });
        const plus = document.getElementById('btn-chat-plus');
        const sheet = document.getElementById('wa-attach-sheet');
        function openSheet(o) { if (sheet) sheet.classList.toggle('oculto', !o); }
        if (plus) plus.addEventListener('click', function () { openSheet(true); });
        if (sheet) sheet.addEventListener('click', function (e) { if (e.target && e.target.getAttribute('data-close-attach')) openSheet(false); });
        const menuList = document.getElementById('btn-chat-menu-list');
        if (menuList) menuList.addEventListener('click', function () { const add = document.getElementById('btn-add-contato'); if (add) add.click(); });
        // Iniciais do avatar quando o nome muda
        const nomeEl = document.getElementById('chat-com-nome');
        const av = document.getElementById('chat-com-av');
        if (nomeEl && av && typeof MutationObserver !== 'undefined') {
            const mo = new MutationObserver(function () {
                const n = (nomeEl.textContent || '?').trim();
                const parts = n.split(/\s+/);
                av.textContent = parts.length > 1 ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase() : n.slice(0, 2).toUpperCase();
            });
            mo.observe(nomeEl, { childList: true, characterData: true, subtree: true });
        }
    })();
    </script>
</body>
</html>
