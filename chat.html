<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera Chat</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260923o">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260923o">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20260923o">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="pagina-chat">
    <div class="container wide">
        <p id="user-label" class="oculto"></p>
        <nav id="app-nav" class="nav-chips oculto"></nav>

        <section class="card chat-wa-layout" id="chat-wa" style="border:0;background:transparent;box-shadow:none;padding:0;margin:0">
            <aside class="chat-contacts-pane" id="chat-contacts-pane">
                <div class="wa-list-head">
                    <button type="button" class="wa-circ-btn" id="btn-chat-menu-list" aria-label="Menu">⋮</button>
                    <div class="wa-head-right">
                        <button type="button" class="wa-circ-btn" id="btn-chat-cam" aria-label="Câmera">📷</button>
                        <button type="button" class="wa-circ-btn accent" id="btn-add-contato" aria-label="Nova conversa">＋</button>
                    </div>
                </div>
                <h1 class="wa-title">Conversas</h1>
                <input type="search" id="chat-busca-contatos" class="wa-search" placeholder="Buscar ou pesquisar…" autocomplete="off">
                <div class="wa-chips" id="wa-filter-chips" role="group" aria-label="Filtros">
                    <button type="button" class="wa-chip on" data-wa="todas">Todas</button>
                    <button type="button" class="wa-chip" data-wa="nao_lidas">Não lidas</button>
                    <button type="button" class="wa-chip" data-wa="favoritos">Favoritos</button>
                </div>
                <div class="wa-archived" id="wa-archived" role="button" tabindex="0">📁 Arquivadas</div>
                <div id="chat-contatos-list" class="chat-contatos-list"></div>
            </aside>

            <div class="chat-thread-pane" id="chat-thread-pane">
                <div id="chat-thread-empty" class="chat-thread-empty">
                    <img class="brand-logo-lg chat-empty-logo" src="logo-escavadeira.png?v=20260923o" alt="" width="96" height="96" decoding="async">
                    <p class="chat-empty-title">Minera Chat</p>
                    <p>Selecione uma conversa.</p>
                </div>
                <div id="chat-thread-active" class="chat-thread-active oculto" data-build="20260923o">
                    <div class="wa-thread-head chat-thread-head" data-build="20260923o">
                        <button type="button" class="wa-back-chev chat-back" id="btn-chat-back" aria-label="Voltar"><span class="wa-back-ico" aria-hidden="true">‹</span><span class="wa-back-unread oculto" id="chat-back-unread" aria-hidden="true"></span></button>
                        <div class="wa-av wa-av-thread" id="chat-com-av" aria-hidden="true">?</div>
                        <div class="wa-thread-info chat-thread-head-info">
                            <strong id="chat-com-nome" class="wa-thread-name">—</strong>
                            <p id="chat-com-papel" class="sub wa-thread-papel" hidden aria-hidden="true"></p>
                        </div>
                        <div class="wa-call-btns chat-thread-head-actions">
                            <div class="wa-call-pill" role="group" aria-label="Chamadas">
                                <button type="button" class="wa-call-ico" id="btn-chat-video" title="Vídeo" aria-label="Vídeo">📹</button>
                                <button type="button" class="wa-call-ico" id="btn-chat-phone" title="Ligar" aria-label="Ligar">📞</button>
                            </div>
                            <button type="button" class="wa-menu-btn" id="btn-chat-menu" title="Opções" aria-label="Opções" aria-haspopup="menu">⋮</button>
                        </div>
                    </div>
                    <div id="chat-head-menu" class="chat-head-menu oculto" role="menu">
                        <button type="button" role="menuitem" id="btn-apagar-hist-mim">Apagar conversa para mim</button>
                        <button type="button" role="menuitem" id="btn-apagar-hist-todos" class="danger">Apagar histórico para todos…</button>
                    </div>
                    <p id="chat-lote-ctx" class="sub oculto"></p>
                    <div id="chat-msgs" class="chat-msgs"></div>

                    <div id="chat-rec-bar" class="chat-rec-bar wa-rec-overlay oculto" role="status" aria-live="polite">
                        <span class="rec-dot" aria-hidden="true"></span>
                        <span id="chat-rec-timer" class="chat-rec-timer">00:00</span>
                        <span class="chat-rec-wave" aria-hidden="true">〰〰〰</span>
                        <button type="button" class="btn-sm btn-danger" id="btn-cancel-rec">Deslize p/ cancelar</button>
                    </div>

                    <div id="chat-media-preview" class="chat-media-preview oculto"></div>
                    <p id="chat-anexo-info" class="hint oculto"></p>

                    <div id="chat-agendar-box" class="chat-agendar-row oculto">
                        <div style="flex:1">
                            <label for="chat-agendar-em">Enviar em</label>
                            <input type="datetime-local" id="chat-agendar-em">
                        </div>
                    </div>

                    <div id="chat-reply-bar" class="chat-reply-bar oculto" aria-live="polite">
                        <div class="chat-reply-bar-body">
                            <span class="chat-reply-bar-label">Respondendo</span>
                            <span id="chat-reply-snippet" class="chat-reply-snippet"></span>
                        </div>
                        <button type="button" class="chat-reply-cancel" id="btn-cancel-reply" title="Cancelar resposta" aria-label="Cancelar resposta">×</button>
                    </div>

                    <form id="form-chat" class="wa-composer chat-form">
                        <!-- WA order (≤800px): + | [pill input + emoji INSIDE right] | camera | mic/send -->
                        <button type="button" class="wa-comp-btn wa-comp-plus" id="btn-chat-plus" aria-label="Anexar">＋</button>
                        <div class="wa-comp-pill">
                            <input type="text" id="chat-texto" class="wa-comp-input" placeholder="Mensagem" maxlength="2000" autocomplete="off" enterkeyhint="send">
                            <button type="button" class="wa-comp-in-emoji" id="btn-chat-emoji" aria-label="Emoji" title="Emoji">😊</button>
                        </div>
                        <button type="button" class="wa-comp-btn wa-comp-cam" id="btn-chat-camera" aria-label="Câmera" title="Câmera">📷</button>
                        <input type="file" id="chat-foto" accept="image/*" capture="environment" class="oculto">
                        <input type="file" id="chat-video" accept="video/*" class="oculto">
                        <input type="file" id="chat-audio-file" accept="audio/*" class="oculto">
                        <input type="file" id="chat-doc" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,application/pdf,image/*" class="oculto">
                        <button type="button" class="wa-comp-btn mic" id="btn-audio" title="Segure para gravar" aria-label="Gravar áudio">🎤</button>
                        <button type="submit" class="wa-comp-btn mic oculto" id="btn-chat-enviar" aria-label="Enviar">➤</button>
                    </form>
                    <!-- legacy toolbar hooks (hidden) -->
                    <div class="chat-toolbar oculto" aria-hidden="true">
                        <button type="button" id="btn-toggle-agendar">Agendar</button>
                        <label for="chat-audio-file" id="btn-anexar-audio">Anexo</label>
                    </div>
                    <div class="chat-extra oculto" aria-hidden="true">
                        <input type="url" id="chat-url-midia" placeholder="https://...">
                    </div>
                    <p id="chat-msg" class="msg"></p>
                </div>
            </div>
        </section>
    </div>

    <div id="modal-add-contato" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modal-add-titulo">
        <div class="modal-backdrop" data-close-add="1"></div>
        <div class="modal-panel chat-add-panel">
            <h3 id="modal-add-titulo">Adicionar por nome</h3>
            <label for="add-busca">Buscar por nome ou apelido</label>
            <input type="search" id="add-busca" placeholder="Digite o nome..." autocomplete="off">
            <div class="chat-add-roles" id="add-role-filters"></div>
            <div id="add-diretorio" class="chat-diretorio-list"></div>
            <p class="hint">Por segurança, e-mails de outros usuários nunca aparecem no chat.</p>
            <p id="add-contato-msg" class="msg"></p>
            <button type="button" class="btn-ghost" id="btn-fechar-add">Fechar</button>
        </div>
    </div>

    <div id="chat-msg-sheet" class="chat-msg-sheet oculto" role="dialog" aria-modal="true" aria-label="Ações da mensagem">
        <div class="chat-msg-sheet-backdrop" data-close-sheet="1"></div>
        <div class="chat-msg-sheet-panel">
            <div class="chat-msg-sheet-handle" aria-hidden="true"></div>
            <p id="chat-msg-sheet-preview" class="chat-msg-sheet-preview"></p>
            <button type="button" class="chat-msg-sheet-item" id="sheet-responder">↩ Responder</button>
            <button type="button" class="chat-msg-sheet-item" id="sheet-apagar-mim">Apagar para mim</button>
            <button type="button" class="chat-msg-sheet-item danger oculto" id="sheet-apagar-todos">Apagar para todos</button>
            <button type="button" class="chat-msg-sheet-item ghost" id="sheet-cancelar" data-close-sheet="1">Cancelar</button>
        </div>
    </div>

    <div id="wa-attach-sheet" class="chat-msg-sheet oculto wa-attach-sheet" role="dialog" aria-modal="true" aria-label="Anexar">
        <div class="chat-msg-sheet-backdrop" data-close-attach="1"></div>
        <div class="chat-msg-sheet-panel">
            <div class="chat-msg-sheet-handle" aria-hidden="true"></div>
            <p style="font-weight:800;margin-bottom:8px">Anexar</p>
            <div class="wa-attach-grid">
                <label class="wa-attach-item" for="chat-foto-gal"><span class="ai">🖼</span>Galeria</label>
                <label class="wa-attach-item" for="chat-foto"><span class="ai">📷</span>Câmera</label>
                <label class="wa-attach-item" for="chat-doc"><span class="ai">📄</span>Documento</label>
                <label class="wa-attach-item" for="chat-video"><span class="ai">🎬</span>Vídeo</label>
                <label class="wa-attach-item" for="chat-audio-file"><span class="ai">🎵</span>Áudio</label>
                <button type="button" class="wa-attach-item" id="btn-attach-agendar" data-att="agendar"><span class="ai">🗓</span>Agendar</button>
            </div>
            <input type="file" id="chat-foto-gal" accept="image/*" class="oculto">
            <label for="chat-url-midia-sheet">URL da mídia</label>
            <input type="url" id="chat-url-midia-sheet" placeholder="https://…" style="margin-bottom:12px">
            <button type="button" class="btn-ghost" data-close-attach="1">Fechar</button>
        </div>
    </div>

    <script src="config.js?v=20260923o"></script>
    <script src="auth-guard.js?v=20260923o"></script>
    <script src="suporte.js?v=20260923o"></script>
    <script src="nav.js?v=20260923o"></script>
    <script src="anti-golpe.js?v=20260923o"></script>
    <script src="chat.js?v=20260923o"></script>
    <script src="pwa.js?v=20260923o"></script>
    <script>
    (function waChrome() {
        function toast(t) { if (typeof toastMsg === 'function') toastMsg(t); else alert(t); }
        const video = document.getElementById('btn-chat-video');
        const phone = document.getElementById('btn-chat-phone');
        if (video) video.addEventListener('click', () => toast('Chamada de vídeo em breve'));
        if (phone) phone.addEventListener('click', () => toast('Chamada de voz em breve'));
        function openCameraCapture() {
            const f = document.getElementById('chat-foto');
            if (f) f.click();
        }
        const cam = document.getElementById('btn-chat-cam');
        if (cam) cam.addEventListener('click', openCameraCapture);
        const camBar = document.getElementById('btn-chat-camera');
        if (camBar) camBar.addEventListener('click', openCameraCapture);
        const plus = document.getElementById('btn-chat-plus');
        const sheet = document.getElementById('wa-attach-sheet');
        function openSheet(o) { if (sheet) sheet.classList.toggle('oculto', !o); }
        if (plus) plus.addEventListener('click', () => openSheet(true));
        if (sheet) sheet.addEventListener('click', (e) => {
            if (e.target && e.target.getAttribute('data-close-attach')) openSheet(false);
        });
        const ag = document.getElementById('btn-attach-agendar');
        if (ag) ag.addEventListener('click', () => {
            openSheet(false);
            const box = document.getElementById('chat-agendar-box');
            const tog = document.getElementById('btn-toggle-agendar');
            if (tog) tog.click();
            else if (box) box.classList.remove('oculto');
        });
        const urlSheet = document.getElementById('chat-url-midia-sheet');
        const urlHidden = document.getElementById('chat-url-midia');
        if (urlSheet && urlHidden) {
            urlSheet.addEventListener('change', () => { urlHidden.value = urlSheet.value; });
        }
        const gal = document.getElementById('chat-foto-gal');
        const foto = document.getElementById('chat-foto');
        if (gal && foto) {
            gal.addEventListener('change', () => {
                if (gal.files && gal.files[0]) {
                    const dt = new DataTransfer();
                    dt.items.add(gal.files[0]);
                    foto.files = dt.files;
                    foto.dispatchEvent(new Event('change', { bubbles: true }));
                }
                openSheet(false);
            });
        }
        ['chat-foto', 'chat-video', 'chat-audio-file', 'chat-doc'].forEach(function (id) {
            const el = document.getElementById(id);
            if (!el || el._sheetCloseBound) return;
            el._sheetCloseBound = true;
            el.addEventListener('change', function () { openSheet(false); });
        });
        const docIn = document.getElementById('chat-doc');
        if (docIn && !docIn._docBound) {
            docIn._docBound = true;
            docIn.addEventListener('change', async function (e) {
                const file = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (typeof pickMidiaArquivo === 'function') {
                    const isImg = /^image\//.test(file.type);
                    await pickMidiaArquivo(file, isImg ? 'imagem' : 'documento');
                }
            });
        }
        const texto = document.getElementById('chat-texto');
        const mic = document.getElementById('btn-audio');
        const send = document.getElementById('btn-chat-enviar');
        function syncSend() {
            const has = !!(texto && texto.value.trim());
            if (mic) mic.classList.toggle('oculto', has);
            if (send) send.classList.toggle('oculto', !has);
        }
        if (texto) {
            texto.addEventListener('input', syncSend);
            // Keep composer above keyboard when focusing
            texto.addEventListener('focus', function () {
                setTimeout(function () {
                    try {
                        const box = document.getElementById('chat-msgs');
                        if (box) box.scrollTop = box.scrollHeight;
                    } catch (err) {}
                }, 280);
            });
        }
        syncSend();
        const emojiBtn = document.getElementById('btn-chat-emoji');
        if (emojiBtn && texto) {
            emojiBtn.addEventListener('click', function () {
                const em = '😊';
                const start = texto.selectionStart || texto.value.length;
                const end = texto.selectionEnd || start;
                texto.value = texto.value.slice(0, start) + em + texto.value.slice(end);
                texto.focus();
                const pos = start + em.length;
                try { texto.setSelectionRange(pos, pos); } catch (err) {}
                syncSend();
            });
        }
        document.querySelectorAll('#wa-filter-chips .wa-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#wa-filter-chips .wa-chip').forEach(b => b.classList.remove('on'));
                btn.classList.add('on');
            });
        });
        const arch = document.getElementById('wa-archived');
        if (arch) arch.addEventListener('click', () => toast('Arquivadas em breve'));
        // Update avatar initials when name changes
        const nomeEl = document.getElementById('chat-com-nome');
        const av = document.getElementById('chat-com-av');
        if (nomeEl && av && typeof MutationObserver !== 'undefined') {
            const mo = new MutationObserver(() => {
                const n = (nomeEl.textContent || '?').trim();
                const parts = n.split(/\s+/);
                av.textContent = parts.length > 1 ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase() : n.slice(0,2).toUpperCase();
            });
            mo.observe(nomeEl, { childList: true, characterData: true, subtree: true });
        }
        // PDF card enhancement for document links in bubbles
        document.addEventListener('click', (e) => {
            const a = e.target && e.target.closest && e.target.closest('.bubble-media a');
            if (!a) return;
            const href = a.getAttribute('href') || '';
            if (/\.pdf($|\?)/i.test(href) || /application\/pdf/i.test(href)) {
                /* native open */
            }
        });
    })();
    </script>
</body>
</html>
