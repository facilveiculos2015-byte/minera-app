<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera App - Perfil</title>
    <link rel="stylesheet" href="style.css?v=20260916h">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div>
                <h1>Minera App</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card">
            <h2>Meu perfil</h2>
            <p class="sub">Atualize nome e papéis. Vários papéis liberam chips diferentes na navegação.</p>
            <form id="form-perfil">
                <label for="perfil-nome">Nome</label>
                <input type="text" id="perfil-nome" required placeholder="Seu nome">
                <label for="perfil-email">E-mail</label>
                <input type="email" id="perfil-email" disabled>
                <fieldset class="papeis-fieldset">
                    <legend>Papéis</legend>
                    <label class="check-row"><input type="checkbox" id="perfil-papel-minerador" value="minerador"> Minerador</label>
                    <label class="check-row"><input type="checkbox" id="perfil-papel-comprador" value="comprador"> Comprador</label>
                    <label class="check-row"><input type="checkbox" id="perfil-papel-transportador_mina_britador" value="transportador_mina_britador"> Transportador (Mina - Britador)</label>
                    <label class="check-row"><input type="checkbox" id="perfil-papel-transportador_britador_porto" value="transportador_britador_porto"> Transportador (Britador - Porto)</label>
                    <label class="check-row"><input type="checkbox" id="perfil-papel-dono_britador" value="dono_britador"> Dono de Britador</label>
                    <label class="check-row"><input type="checkbox" id="perfil-papel-carregamento" value="carregamento"> Operador de Carregamento</label>
                    <label class="check-row oculto" id="row-admin"><input type="checkbox" id="perfil-papel-admin" value="admin"> Admin</label>
                </fieldset>
                <button type="submit">Salvar perfil</button>
            </form>
            <p id="perfil-msg" class="msg"></p>
        </section>

        <section class="card" id="card-pix-user">
            <h2>Pagar via Pix</h2>
            <div id="pix-user-info" class="loading">Carregando chave...</div>
            <form id="form-pix-comprovante" class="oculto" style="margin-top:12px">
                <label for="pix-valor">Valor (R$)</label>
                <input type="number" id="pix-valor" step="0.01" min="0" placeholder="0,00">
                <label for="pix-comprovante">URL do comprovante</label>
                <input type="url" id="pix-comprovante" required placeholder="https://... ou link do comprovante">
                <button type="submit">Enviei comprovante</button>
            </form>
            <p id="pix-user-msg" class="msg"></p>
            <div id="pix-user-hist" class="sub"></div>
        </section>

    </div>
    <script src="config.js?v=20260916h"></script>
    <script src="auth-guard.js?v=20260916h"></script>
    <script src="nav.js?v=20260916h"></script>
    <script src="perfil.js?v=20260916h"></script>
</body>
</html>
