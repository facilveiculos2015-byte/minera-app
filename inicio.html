<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera Pará - Marketplace</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260923p">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260923p">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20260923p">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="pagina-inicio">
    <div class="container wide">
        <p id="user-label" class="oculto" aria-hidden="true"></p>

        <div class="olx-top">
            <button type="button" class="olx-loc" id="olx-loc-btn" aria-label="Cidade">
                <span class="pin" aria-hidden="true">📍</span>
                <span id="olx-city">Parauapebas</span>
                <span class="chev" aria-hidden="true">▾</span>
            </button>
            <button type="button" class="olx-bell" id="btn-notif" title="Notificações" aria-label="Notificações">
                🔔<span class="notif-badge oculto" id="notif-badge">0</span>
            </button>
        </div>

        <div class="olx-tabs" id="filtro-tipo-chips" role="tablist" aria-label="Categorias">
            <button type="button" class="olx-tab on" data-tipo="" role="tab">Todos</button>
            <button type="button" class="olx-tab" data-tipo="Ouro" role="tab">Ouro</button>
            <button type="button" class="olx-tab" data-tipo="Ferro" role="tab">Ferro</button>
            <button type="button" class="olx-tab" data-tipo="Cobre" role="tab">Cobre</button>
            <button type="button" class="olx-tab" data-tipo="Níquel" role="tab">Níquel</button>
        </div>

        <div class="olx-search-wrap">
            <input type="search" id="mkt-busca" class="olx-search" placeholder="Buscar minério, código ou cidade…" autocomplete="off" aria-label="Buscar">
        </div>

        <div class="olx-quick" aria-label="Atalhos">
            <button type="button" class="olx-qcard" id="q-favoritos"><span class="qi">♡</span>Favoritos</button>
            <button type="button" class="olx-qcard" id="btn-mapa"><span class="qi">🗺</span>Mapa</button>
            <button type="button" class="olx-qcard" id="cta-servicos"><span class="qi">🛠</span>Serviços</button>
            <button type="button" class="olx-qcard" id="btn-banco"><span class="qi">🏦</span>Banco</button>
        </div>

        <section class="card cotacoes-card cotacoes-compact" id="card-cotacoes" aria-label="Cotações de mercado">
            <div class="cotacoes-strip-head">
                <span class="cotacoes-strip-title">Cotações</span>
                <span class="cotacoes-fonte" id="cotacoes-atualizado">…</span>
            </div>
            <div class="cotacoes-grid cotacoes-strip" id="cotacoes-grid">
                <div class="cotacao-item">
                    <div class="c-label">Dólar</div>
                    <div class="c-valor" id="cot-dolar">—</div>
                    <div class="c-sub" id="cot-dolar-sub">USD/BRL</div>
                </div>
                <div class="cotacao-item">
                    <div class="c-label">Ouro</div>
                    <div class="c-valor" id="cot-ouro">—</div>
                    <div class="c-sub" id="cot-ouro-sub">USD/g</div>
                </div>
                <div class="cotacao-item">
                    <div class="c-label">Cobre</div>
                    <div class="c-valor" id="cot-cobre">—</div>
                    <div class="c-sub" id="cot-cobre-sub">USD/t</div>
                </div>
            </div>
            <div class="cotacoes-links" id="cotacoes-links">
                <a id="link-lme-copper" href="https://www.lme.com/en/Metals/Non-ferrous/LME-Copper" target="_blank" rel="noopener noreferrer">LME Copper</a>
                <a id="link-lme-home" href="https://www.lme.com/" target="_blank" rel="noopener noreferrer">LME Home</a>
                <a id="link-gold-lbma" href="https://www.lbma.org.uk/prices-and-data/precious-metal-prices" target="_blank" rel="noopener noreferrer">Gold LBMA</a>
            </div>
        </section>

        <div class="olx-banner" id="olx-banner" aria-label="Destaques">
            <div class="olx-banner-track" id="olx-banner-track"><!-- preenchido por inicio.js via app_promos --></div>
        </div>
        <div class="olx-promo">Promo: anuncie seu lote e negocie direto com compradores da região.</div>

        <!-- Hidden filters kept for JS compatibility -->
        <div class="oculto" aria-hidden="true">
            <div id="loc-bar"><button type="button" id="loc-bar-toggle" aria-expanded="false"></button>
                <div id="loc-bar-panel" hidden>
                    <div id="filtro-local-chips"><button class="fchip on" data-loc="todos"></button></div>
                    <select id="filtro-estado"></select><select id="filtro-cidade"></select><select id="filtro-ddd"></select>
                    <div id="filtro-servico-chips"><button class="fchip on" data-servico=""></button></div>
                </div>
            </div>
            <div id="filtro-status-chips"><button class="fchip on" data-status=""></button></div>
            <span id="loc-status"></span>
        </div>

        <div id="feed" class="olx-feed loading">Carregando...</div>
        <a class="olx-fab" id="fab-anunciar" href="lotes.html" title="Anunciar" aria-label="Anunciar">＋</a>
        <nav id="app-nav" class="nav-chips oculto"></nav>
    </div>
    <script src="config.js?v=20260923p"></script>
    <script src="auth-guard.js?v=20260923p"></script>
    <script src="suporte.js?v=20260923p"></script>
    <script src="nav.js?v=20260923p"></script>
    <script src="localidade.js?v=20260923p"></script>
    <script src="inicio.js?v=20260923p"></script>
    <script src="pwa.js?v=20260923p"></script>
</body>
</html>
