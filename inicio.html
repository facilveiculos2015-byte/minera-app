<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera App - Feed</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260916ag">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260916ag">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f59e0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera">
    <link rel="stylesheet" href="style.css?v=20260916ag">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div class="brand-title">
                <h1>Minera App</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <div class="header-actions">
                <a class="btn-caixa-bank" id="btn-caixa-bank" href="financeiro.html" title="Caixa Minera" aria-label="Caixa Minera">
                    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M12 3L2 9v2h20V9L12 3zm1 6H11v2h2V9zm-4 0H7v2h2V9zm8 0h-2v2h2V9zM4 13v7h3v-5h2v5h2v-5h2v5h2v-5h2v5h3v-7H4z"/>
                    </svg>
                </a>
                <button type="button" class="btn-icon" id="btn-notif" title="Notificações" aria-label="Notificações">🔔<span class="notif-badge oculto" id="notif-badge">0</span></button>
                <button type="button" class="btn-sair" id="btn-sair">Sair</button>
            </div>
        </header>

        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card cotacoes-card cotacoes-compact" id="card-cotacoes">
            <div class="cotacoes-strip-head">
                <span class="cotacoes-strip-title">Cotações</span>
                <span class="cotacoes-fonte" id="cotacoes-atualizado">…</span>
            </div>
            <div class="cotacoes-grid cotacoes-strip" id="cotacoes-grid">
                <div class="cotacao-item">
                    <div class="c-label">Dólar</div>
                    <div class="c-valor" id="cot-dolar">—</div>
                    <div class="c-sub" id="cot-dolar-sub">USD/BRL</div>
                </div>
                <div class="cotacao-item">
                    <div class="c-label">Ouro</div>
                    <div class="c-valor" id="cot-ouro">—</div>
                    <div class="c-sub" id="cot-ouro-sub">USD/g</div>
                </div>
                <div class="cotacao-item">
                    <div class="c-label">Cobre</div>
                    <div class="c-valor" id="cot-cobre">—</div>
                    <div class="c-sub" id="cot-cobre-sub">USD/t</div>
                </div>
            </div>
            <div class="cotacoes-links" id="cotacoes-links">
                <a id="link-lme-copper" href="https://www.lme.com/en/Metals/Non-ferrous/LME-Copper" target="_blank" rel="noopener noreferrer">LME Copper</a>
                <a id="link-lme-home" href="https://www.lme.com/" target="_blank" rel="noopener noreferrer">LME Home</a>
                <a id="link-gold-lbma" href="https://www.lbma.org.uk/prices-and-data/precious-metal-prices" target="_blank" rel="noopener noreferrer">Gold LBMA</a>
            </div>
        </section>

        <section class="card">
            <h2>Marketplace</h2>
            <p class="sub">Feed de lotes — negocie e veja detalhes</p>

            <div class="loc-bar loc-bar-collapsed" id="loc-bar">
                <button type="button" class="loc-bar-toggle" id="loc-bar-toggle" aria-expanded="false" aria-controls="loc-bar-panel">
                    <span class="loc-bar-toggle-title">Filtros</span>
                    <span class="loc-bar-status" id="loc-status" aria-live="polite">Detectando localização…</span>
                    <span class="loc-bar-chevron" aria-hidden="true">▼</span>
                </button>
                <div class="loc-bar-panel" id="loc-bar-panel" hidden>
                    <div class="chip-filters loc-mode-chips" id="filtro-local-chips" role="group" aria-label="Filtro de localidade">
                        <button type="button" class="fchip on" data-loc="todos">Todos</button>
                        <button type="button" class="fchip" data-loc="estado">Estado</button>
                        <button type="button" class="fchip" data-loc="cidade">Cidade</button>
                        <button type="button" class="fchip" data-loc="ddd">DDD</button>
                    </div>
                    <div class="loc-selects" id="loc-selects">
                        <select id="filtro-estado" aria-label="Estado" class="loc-select">
                            <option value="">Estado (UF)</option>
                        </select>
                        <select id="filtro-cidade" aria-label="Cidade" class="loc-select" disabled>
                            <option value="">Cidade</option>
                        </select>
                        <select id="filtro-ddd" aria-label="DDD" class="loc-select">
                            <option value="">DDD</option>
                        </select>
                    </div>
                    <p class="filtro-grupo-label">Tipo de serviço</p>
                    <div class="chip-filters" id="filtro-servico-chips" role="group" aria-label="Tipo de serviço">
                        <button type="button" class="fchip on" data-servico="">Todos</button>
                        <button type="button" class="fchip" data-servico="minerador">Minerador</button>
                        <button type="button" class="fchip" data-servico="comprador">Comprador</button>
                        <button type="button" class="fchip" data-servico="transportador">Transportador</button>
                        <button type="button" class="fchip" data-servico="dono_britador">Dono de Britador</button>
                        <button type="button" class="fchip" data-servico="carregamento">Carregador</button>
                    </div>
                </div>
            </div>

            <div class="chip-filters" id="filtro-tipo-chips" role="group" aria-label="Tipo de minério">
                <button type="button" class="fchip on" data-tipo="">Todos</button>
                <button type="button" class="fchip" data-tipo="Ouro">Ouro</button>
                <button type="button" class="fchip" data-tipo="Ferro">Ferro</button>
                <button type="button" class="fchip" data-tipo="Cobre">Cobre</button>
            </div>
            <div class="chip-filters" id="filtro-status-chips" role="group" aria-label="Status">
                <button type="button" class="fchip on" data-status="">Todos</button>
                <button type="button" class="fchip" data-status="pendente">Disponível</button>
                <button type="button" class="fchip" data-status="em_processo">Em trânsito</button>
                <button type="button" class="fchip" data-status="expedido">Vendido</button>
            </div>

            <div id="feed" class="loading">Carregando...</div>
        </section>
    </div>
    <script src="config.js?v=20260916ag"></script>
    <script src="auth-guard.js?v=20260916ag"></script>
    <script src="suporte.js?v=20260916ag"></script>
    <script src="nav.js?v=20260916ag"></script>
    <script src="localidade.js?v=20260916ag"></script>
    <script src="inicio.js?v=20260916ag"></script>
    <script src="pwa.js?v=20260916ag"></script>
</body>
</html>
