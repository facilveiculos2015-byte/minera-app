<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.bigdatacloud.net https://nominatim.openstreetmap.org https://api.allorigins.win https://servicodados.ibge.gov.br https://economia.awesomeapi.com.br https://api.gold-api.com https://query1.finance.yahoo.com https://api.coinbase.com https://metalmetric.com https://mintedmetal.com; worker-src 'self' blob:; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Minera Pará - Marketplace</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20261006a">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261006a">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20261006a">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="pagina-inicio">
    <div class="container wide">
        <p id="user-label" class="oculto" aria-hidden="true"></p>

        <div class="olx-top">
            <button type="button" class="olx-loc" id="olx-loc-btn" aria-label="Cidade">
                <span class="pin" aria-hidden="true">📍</span>
                <span id="olx-city">Todo o Brasil</span>
                <span class="chev" aria-hidden="true">▾</span>
            </button>
            <button type="button" class="olx-bell" id="btn-notif" title="Notificações" aria-label="Notificações">
                🔔<span class="notif-badge oculto" id="notif-badge">0</span>
            </button>
        </div>

        <div class="olx-tabs" id="filtro-tipo-chips" role="tablist" aria-label="Categorias">
            <button type="button" class="olx-tab on" data-tipo="" role="tab">Todos</button>
            <button type="button" class="olx-tab" data-tipo="Ouro" role="tab">Ouro</button>
            <button type="button" class="olx-tab" data-tipo="Ferro" role="tab">Ferro</button>
            <button type="button" class="olx-tab" data-tipo="Cobre" role="tab">Cobre</button>
            <button type="button" class="olx-tab" data-tipo="Níquel" role="tab">Níquel</button>
        </div>

        <div class="olx-search-wrap">
            <input type="search" id="mkt-busca" class="olx-search" placeholder="Buscar minério, maquinário, código ou cidade…" autocomplete="off" aria-label="Buscar">
        </div>

        <div class="olx-quick" aria-label="Atalhos">
            <button type="button" class="olx-qcard q-fav" id="q-favoritos" aria-label="Favoritos">
                <span class="qi-wrap" aria-hidden="true"><svg class="qi-svg" viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-6.5-4.1-8.6-8.1C1.8 9.4 3.1 6.5 6 6.2c1.7-.2 3.2.7 4 2  .8-1.3 2.3-2.2 4-2 2.9.3 4.2 3.2 2.6 6.2-2.1 4-8.6 8.1-8.6 8.1z" fill="currentColor"/></svg></span>
                Favoritos
            </button>
            <button type="button" class="olx-qcard q-serv" id="cta-servicos" aria-label="Serviços">
                <span class="qi-wrap" aria-hidden="true"><svg class="qi-svg" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 0 0 3 3l1.8-1.8a3 3 0 1 1-3 3L10 17l-3 1 1-3 6.5-6.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 20h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                Serviços
            </button>
            <button type="button" class="olx-qcard q-maq" id="q-maquinario" aria-label="Maquinário">
                <span class="qi-wrap" aria-hidden="true"><svg class="qi-svg" viewBox="0 0 24 24" fill="none"><path d="M14 7V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="7" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M17 11h3l1 3v3h-2m-2-2h.01M7 17v2m6-2v2M8 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                Maquinário
            </button>
            <button type="button" class="olx-qcard q-banco" id="btn-banco" aria-label="Banco">
                <span class="qi-wrap" aria-hidden="true"><svg class="qi-svg" viewBox="0 0 24 24" fill="none"><path d="M4 10h16M6 10v8m4-8v8m4-8v8m4-8v8M3 18h18M12 4l9 5H3l9-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
                Banco
            </button>
        </div>


        <div class="minera-install-banner" id="minera-install-banner" data-minera-install-host role="region" aria-label="Baixar app">
            <span class="mib-ico" aria-hidden="true">📲</span>
            <div class="mib-txt"><strong>Leve o Minera no bolso</strong>Um toque e o app fica no celular.</div>
            <button type="button" class="mib-btn" id="btn-instalar-app" data-minera-install>Baixar app</button>
        </div>

        <section class="card cotacoes-card cotacoes-compact" id="card-cotacoes" aria-label="Cotações de mercado">
            <div class="cotacoes-strip-head">
                <span class="cotacoes-strip-title">Cotações</span>
                <span class="cotacoes-fonte" id="cotacoes-atualizado">…</span>
            </div>
            <div class="cotacoes-grid cotacoes-strip" id="cotacoes-grid">
                <div class="cotacao-item">
                    <div class="c-label">Dólar</div>
                    <div class="c-valor" id="cot-dolar">—</div>
                    <div class="c-sub" id="cot-dolar-sub">USD/BRL</div>
                </div>
                <div class="cotacao-item">
                    <div class="c-label">Ouro</div>
                    <div class="c-valor" id="cot-ouro">—</div>
                    <div class="c-sub" id="cot-ouro-sub">USD/g</div>
                </div>
                <div class="cotacao-item">
                    <div class="c-label">Cobre</div>
                    <div class="c-valor" id="cot-cobre">—</div>
                    <div class="c-sub" id="cot-cobre-sub">USD/t</div>
                </div>
            </div>
            <div class="cotacoes-links" id="cotacoes-links">
                <a id="link-lme-copper" href="https://www.lme.com/en/Metals/Non-ferrous/LME-Copper" target="_blank" rel="noopener noreferrer">LME Copper</a>
                <a id="link-lme-home" href="https://www.lme.com/" target="_blank" rel="noopener noreferrer">LME Home</a>
                <a id="link-gold-lbma" href="https://www.lbma.org.uk/prices-and-data/precious-metal-prices" target="_blank" rel="noopener noreferrer">Gold LBMA</a>
            </div>
        </section>

        <div class="olx-banner" id="olx-banner" aria-label="Destaques">
            <div class="olx-banner-track" id="olx-banner-track"><!-- preenchido por inicio.js via app_promos --></div>
            <div class="olx-banner-dots" id="olx-banner-dots" hidden aria-hidden="false"></div>
        </div>
        <div class="olx-promo">Promo: anuncie seu lote e negocie direto com compradores da região.</div>

        <!-- Hidden filters kept for JS compatibility -->
        <div class="oculto" aria-hidden="true">
            <div id="loc-bar"><button type="button" id="loc-bar-toggle" aria-expanded="false"></button>
                <div id="loc-bar-panel" hidden>
                    <button type="button" class="fchip btn-perto-de-mim" id="btn-perto-de-mim" aria-label="Usar minha localização">📍 Perto de mim</button>
                    <div id="filtro-local-chips"><button type="button" class="fchip on" data-loc="todos">Todo o Brasil</button></div>
                    <select id="filtro-estado"></select><select id="filtro-cidade"></select><select id="filtro-ddd"></select>
                    <div id="filtro-servico-chips"><button class="fchip on" data-servico=""></button></div>
                </div>
            </div>
            <div id="filtro-status-chips"><button class="fchip on" data-status=""></button></div>
            <span id="loc-status"></span>
        </div>

        <div id="feed" class="olx-feed loading">Carregando...</div>
        <!-- Chat Minera: instala o chat (app só-chat em /chat/) na tela inicial do celular. Anunciar continua em Lotes (+ Novo Lote) e Perfil > Meus anúncios (+ Anunciar). -->
        <a class="olx-fab chat-ext-fab" id="fab-chat-ext" href="chat/instalar.html" title="Colocar o chat na tela inicial do celular" aria-label="Chat na tela inicial: colocar o Chat Minera na tela inicial do celular">
            <img class="cef-ico" src="chat/icon-192.png?v=20261006a" alt="" width="36" height="36" aria-hidden="true">
            <span class="cef-txt">Chat na<br>tela inicial</span>
        </a>
        <nav id="app-nav" class="nav-chips oculto"></nav>
    </div>
    <script src="config.js?v=20261006a"></script>
    <script src="seguranca.js?v=20261006a"></script>
    <script src="auth-guard.js?v=20261006a"></script>
    <script src="suporte.js?v=20261006a"></script>
    <script src="chat-realtime.js?v=20261006a"></script>
    <script src="avatar.js?v=20261006a"></script>
    <script src="nav.js?v=20261006a"></script>
    <script src="geo.js?v=20261006a"></script>
    <script src="localidade.js?v=20261006a"></script>
    <script src="anuncio-card.js?v=20261006a"></script>
    <script src="banners.js?v=20261006a"></script>
    <script src="inicio.js?v=20261006a"></script>
    <script src="pwa.js?v=20261006a"></script>
</body>
</html>
