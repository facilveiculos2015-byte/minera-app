<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera App - Lotes</title>
    <link rel="stylesheet" href="style.css?v=20260916d">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div>
                <h1>Minera App</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>

        <nav id="app-nav" class="nav-chips"></nav>

        <main>
            <section class="card">
                <h2>Lotes em Andamento</h2>
                <div id="lotes-lista" class="loading">Carregando dados...</div>
            </section>

            <section class="card">
                <h2>Novo Lote</h2>
                <form id="form-lote">
                    <label for="codigo_lote">Código</label>
                    <input type="text" id="codigo_lote" placeholder="Ex: LT-001" required>
                    <label for="origem">Origem / Frente</label>
                    <input type="text" id="origem" placeholder="Frente / Origem" required>
                    <label for="tipo_minerio">Tipo de minério</label>
                    <select id="tipo_minerio" required>
                        <option value="">Selecione...</option>
                        <option value="Cobre">Cobre</option>
                        <option value="Ferro">Ferro</option>
                        <option value="Ouro">Ouro</option>
                        <option value="Manganês">Manganês</option>
                        <option value="Níquel">Níquel</option>
                        <option value="Outro">Outro</option>
                    </select>
                    <label for="peso_bruto">Peso bruto (kg)</label>
                    <input type="number" id="peso_bruto" placeholder="Peso Bruto (kg)" required step="0.01" min="0">
                    <button type="submit">Cadastrar Lote</button>
                </form>
                <p id="lote-msg" class="msg"></p>
            </section>
        </main>
    </div>
    <script src="config.js?v=20260916d"></script>
    <script src="auth-guard.js?v=20260916d"></script>
    <script src="nav.js?v=20260916d"></script>
    <script src="lotes.js?v=20260916d"></script>
</body>
</html>
