<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera App - Lotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header class="header-row">
            <div>
                <h1>Minera App</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>

        <nav class="nav-chips">
            <a class="chip" href="inicio.html">Início</a>
            <a class="chip on" href="lotes.html">Meus lotes / cadastrar</a>
        </nav>

        <main>
            <section class="card">
                <h2>Lotes em Andamento</h2>
                <div id="lotes-lista" class="loading">Carregando dados...</div>
            </section>

            <section class="card">
                <h2>Novo Lote</h2>
                <form id="form-lote">
                    <input type="text" id="codigo_lote" placeholder="Código do Lote (Ex: LT-001)" required>
                    <input type="text" id="origem" placeholder="Frente / Origem" required>
                    <input type="number" id="peso_bruto" placeholder="Peso Bruto (kg)" required step="0.01" min="0">
                    <button type="submit">Cadastrar Lote</button>
                </form>
            </section>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="lotes.js"></script>
</body>
</html>
