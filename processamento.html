<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera Pará - Britagem</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260923l">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260923l">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20260923l">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div class="brand-title">
                <h1>Minera Pará</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card painel-britagem">
            <h2>Painel de Britagem</h2>
            <p class="sub">Configuração e fila — dono de britador</p>
            <div class="kpi-grid" id="britagem-kpis">
                <div class="kpi-card"><div class="kpi-value" id="kpi-preco">—</div><div class="kpi-label">R$/ton britagem</div></div>
                <div class="kpi-card"><div class="kpi-value" id="kpi-tempo">—</div><div class="kpi-label">Tempo estimado</div></div>
                <div class="kpi-card"><div class="kpi-value" id="kpi-fila">—</div><div class="kpi-label">Na fila</div></div>
                <div class="kpi-card"><div class="kpi-value" id="kpi-proc">—</div><div class="kpi-label">Em processamento</div></div>
                <div class="kpi-card"><div class="kpi-value" id="kpi-prazo">—</div><div class="kpi-label">Prazo retirada</div></div>
            </div>
            <form id="form-britagem-config" class="config-form">
                <div class="filtros-row">
                    <div class="filtro-campo">
                        <label for="cfg-preco">Preço britagem por tonelada (R$)</label>
                        <input type="number" id="cfg-preco" step="0.01" min="0" value="50">
                    </div>
                    <div class="filtro-campo">
                        <label for="cfg-tempo">Tempo estimado (horas / lote)</label>
                        <input type="number" id="cfg-tempo" step="0.5" min="0" value="4">
                    </div>
                    <div class="filtro-campo">
                        <label for="cfg-prazo">Prazo máximo retirada (dias)</label>
                        <input type="number" id="cfg-prazo" step="1" min="1" value="3">
                    </div>
                </div>
                <button type="submit" id="btn-salvar-cfg">Salvar configuração</button>
                <p id="cfg-msg" class="msg"></p>
            </form>
        </section>

        <section class="card">
            <h2>Processamentos / Britagem</h2>
            <div id="proc-lista" class="loading">Carregando...</div>
        </section>

        <section class="card">
            <h2>Registrar britagem</h2>
            <form id="form-proc">
                <label for="lote_id">Lote</label>
                <select id="lote_id" required></select>
                <label for="britador_id">Britador</label>
                <input type="text" id="britador_id" placeholder="Ex: BR-01" required>
                <label for="peso_saida_kg">Peso saída (kg)</label>
                <input type="number" id="peso_saida_kg" step="0.01" min="0" required>
                <label for="inicio_processo">Início</label>
                <input type="datetime-local" id="inicio_processo">
                <label for="fim_processo">Fim</label>
                <input type="datetime-local" id="fim_processo">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" rows="2" placeholder="Opcional"></textarea>
                <button type="submit">Salvar processamento</button>
            </form>
            <p id="proc-msg" class="msg"></p>
        </section>
    </div>
    <script src="config.js?v=20260923l"></script>
    <script src="auth-guard.js?v=20260923l"></script>
    <script src="suporte.js?v=20260923l"></script>
    <script src="nav.js?v=20260923l"></script>
    <script src="processamento.js?v=20260923l"></script>
    <script src="pwa.js?v=20260923l"></script>
</body>
</html>
