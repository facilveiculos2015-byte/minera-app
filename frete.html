<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera Pará - Frete</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260923s">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260923s">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20260923s">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div class="brand-title">
                <h1>Minera Pará</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card">
            <h2>Fretes / logística</h2>
            <p class="sub">Pernas: Mina → Britador e Britador → Porto de embarque</p>
            <div id="frete-lista" class="loading">Carregando...</div>
        </section>

        <section class="card">
            <h2>Agendar frete</h2>
            <form id="form-frete">
                <label for="frete_lote_id">Lote (opcional)</label>
                <select id="frete_lote_id"><option value="">—</option></select>
                <label for="perna">Perna</label>
                <select id="perna" required>
                    <option value="mina_britador">Mina → Britador</option>
                    <option value="britador_porto">Britador → Porto</option>
                </select>
                <label for="origem">Origem</label>
                <input type="text" id="origem" required placeholder="Ex: Frente 3 / Britador A">
                <label for="destino">Destino</label>
                <input type="text" id="destino" required placeholder="Ex: Britador A / Porto de embarque">
                <label for="veiculo">Veículo</label>
                <input type="text" id="veiculo" placeholder="Placa / modelo">
                <label for="motorista">Motorista</label>
                <input type="text" id="motorista" placeholder="Nome">
                <label for="peso_kg">Peso (kg)</label>
                <input type="number" id="peso_kg" step="0.01" min="0">
                <label for="status">Status</label>
                <select id="status">
                    <option value="agendado">agendado</option>
                    <option value="em_transito">em_transito</option>
                    <option value="concluido">concluido</option>
                    <option value="cancelado">cancelado</option>
                </select>
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" rows="2" placeholder="Opcional"></textarea>
                <button type="submit">Salvar frete</button>
            </form>
            <p id="frete-msg" class="msg"></p>
        </section>

        <section class="card">
            <h2>Pagar via Pix</h2>
            <p class="sub">Use a chave Pix do admin e envie o comprovante no Perfil.</p>
            <div id="frete-pix-info" class="loading">Carregando...</div>
            <p style="margin-top:10px"><a class="btn-card" href="perfil.html#pix" id="link-pix-perfil">Ir para Perfil → Pix</a></p>
        </section>
    </div>
    <script src="config.js?v=20260923s"></script>
    <script src="auth-guard.js?v=20260923s"></script>
    <script src="suporte.js?v=20260923s"></script>
    <script src="nav.js?v=20260923s"></script>
    <script src="frete.js?v=20260923s"></script>
    <script src="pwa.js?v=20260923s"></script>
</body>
</html>
