<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera Pará - Relatórios</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260923ak">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260923ak">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20260923ak">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div class="brand-title">
                <h1>Minera Pará</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="card">
            <h2>KPIs</h2>
            <div id="kpi-grid" class="kpi-grid">Carregando...</div>
        </section>

        <section class="card">
            <h2>Histórico de cotações</h2>
            <p class="sub">Últimos pontos salvos localmente (e no Supabase se SQL 13 aplicado)</p>
            <div id="cotacoes-historico-rel" class="cotacoes-historico"><p class="sub">Carregando…</p></div>
        </section>

        <section class="card" id="logs-section">
            <h2>Logs do sistema</h2>
            <p class="sub">Últimas ações registradas (visível se RLS permitir)</p>
            <div id="logs-lista" class="loading">Carregando...</div>
        </section>
    </div>
    <script src="config.js?v=20260923ak"></script>
    <script src="auth-guard.js?v=20260923ak"></script>
    <script src="suporte.js?v=20260923ak"></script>
    <script src="nav.js?v=20260923ak"></script>
    <script src="relatorios.js?v=20260923ak"></script>
    <script src="pwa.js?v=20260923ak"></script>
</body>
</html>
