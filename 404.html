    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

        }
        .box { max-width: 420px; }
        img.logo { width: 96px; height: 96px; border-radius: 50%; border: 3px solid #F5A623; }
        h1 { color: #F5A623; font-size: 1.35rem; margin: 16px 0 8px; }
        p { color: #94a3b8; line-height: 1.45; }
        a {
            display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 999px;
            background: #F5A623; color: #0B1220; font-weight: 700; text-decoration: none;
        }
        noscript a { margin-top: 8px; }
    </style>
    <script>
    (function () {
        var path = location.pathname || '';
        // Links antigos do project site (…/minera-app/<página>) que chegarem ao domínio novo:
        // /minera-app/lotes.html?x → /lotes.html?x (o /c/CODIGO continua abaixo).
        var legacy = /^\/minera-app(\/.*)?$/i.exec(path);
        if (legacy && location.hostname !== 'facilveiculos2015-byte.github.io') {
            var rest = legacy[1] || '/';
            if (!/\/c\/[A-Za-z0-9_-]+\/?$/i.test(rest)) {
                location.replace(rest + location.search + location.hash);
                return;
            }
            path = rest;
        }
        var APP = /^\/minera-app(\/|$)/.test(location.pathname) && location.hostname === 'facilveiculos2015-byte.github.io' ? '/minera-app/' : '/';
        var code = '';
        var m = path.match(/\/c\/([A-Za-z0-9_-]+)\/?$/i);
        if (m) code = String(m[1] || '').toUpperCase();
        if (!code) {
            try {
                var q = new URLSearchParams(location.search);
                code = String(q.get('ref') || q.get('c') || '').trim().toUpperCase();
            } catch (e) { /* ignore */ }
        }
        var dest = APP + 'entrar.html';
        // App instalado (PWA/APK) segue direto pro cadastro; navegador → site (landing), código fica guardado
        var appMode = false;
        try {
            var mm = window.matchMedia;
            if (mm && (mm('(display-mode: standalone)').matches || mm('(display-mode: fullscreen)').matches || mm('(display-mode: minimal-ui)').matches)) appMode = true;
            if (navigator.standalone === true) appMode = true;
            if ((document.referrer || '').indexOf('android-app://') === 0) appMode = true;
            if (sessionStorage.getItem('minera_is_twa') === '1') appMode = true;
        } catch (e3) { /* ignore */ }
        if (code) {
            try { localStorage.setItem('minera_ref', code); } catch (e2) { /* ignore */ }
            dest = appMode ? dest + '?ref=' + encodeURIComponent(code) + '&welcome=1' : APP;
        }
        location.replace(dest);
    })();
    </script>
