    <script>
    (function waChrome() {
        function toast(t) { if (typeof toastMsg === 'function') toastMsg(t); }
        const cam = document.getElementById('btn-chat-cam');
        if (cam) cam.addEventListener('click', function () {
            if (typeof contatoAtivo === 'undefined' || !contatoAtivo || !contatoAtivo.auth_id) { toast('Abra uma conversa para enviar foto.'); return; }
            const f = document.getElementById('chat-foto'); if (f) f.click();
        });
        const plus = document.getElementById('btn-chat-plus');
        const sheet = document.getElementById('wa-attach-sheet');
        function openSheet(o) {
            if (!sheet) return;
            if (o) {
                var pop = sheet.querySelector('.cx-attach-pop');
                if (pop && plus) { var r = plus.getBoundingClientRect(); pop.style.left = Math.max(8, Math.round(r.left)) + 'px'; pop.style.bottom = Math.max(8, Math.round(window.innerHeight - r.top + 8)) + 'px'; }
                sheet.classList.remove('oculto'); requestAnimationFrame(function () { requestAnimationFrame(function () { sheet.classList.add('aberto'); }); }); if (plus) plus.classList.add('on');
            }
            else { sheet.classList.remove('aberto'); if (plus) plus.classList.remove('on'); setTimeout(function () { if (!sheet.classList.contains('aberto')) sheet.classList.add('oculto'); }, 180); }
        }
        window.waAnexarMenu = openSheet;
        if (plus) plus.addEventListener('click', function () { openSheet(sheet && sheet.classList.contains('oculto')); });
        if (sheet) sheet.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('label.cx-item')) setTimeout(function () { openSheet(false); }, 60); });
        if (sheet) sheet.addEventListener('click', function (e) { if (e.target && e.target.getAttribute('data-close-attach')) openSheet(false); });
        // Voltar da LISTA: volta à tela anterior (mesma lógica do Voltar das páginas — irVoltarApp/nav.js); sem histórico → Início
        const listBack = document.getElementById('btn-chat-list-back');
        if (listBack) listBack.addEventListener('click', function (ev) {
            if (ev) ev.preventDefault();
            var ref = document.referrer || '';
            var same = ref && ref.indexOf(location.origin) === 0;
            // desktop: conversa aberta ao lado empilha estado chatPeer — pula ele também
            if (same && history.state && history.state.chatPeer && history.length > 2) { try { history.go(-2); return; } catch (e) { /* ignore */ } }
            if (typeof irVoltarApp === 'function') { irVoltarApp(); return; }
            if (same && history.length > 1) { history.back(); return; }
            location.href = (typeof APP_ROOT === 'string' ? APP_ROOT : '') + 'inicio.html';
        });
        const menuList = document.getElementById('btn-chat-menu-list');
        if (menuList) menuList.addEventListener('click', function () { const add = document.getElementById('btn-add-contato'); if (add) add.click(); });
        // Iniciais do avatar quando o nome muda
        const nomeEl = document.getElementById('chat-com-nome');
        const av = document.getElementById('chat-com-av');
        if (nomeEl && av && !window.MineraAvatar && typeof MutationObserver !== 'undefined') {
            const mo = new MutationObserver(function () {
                const n = (nomeEl.textContent || '?').trim();
                const parts = n.split(/\s+/);
                av.textContent = parts.length > 1 ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase() : n.slice(0, 2).toUpperCase();
            });
            mo.observe(nomeEl, { childList: true, characterData: true, subtree: true });
        }
    })();
    </script>
