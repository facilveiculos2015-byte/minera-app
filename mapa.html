<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minera Pará - Mapa</title>
    <link rel="icon" type="image/png" href="icon-192.png?v=20260923m">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260923m">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#F5A623">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minera Pará">
    <link rel="stylesheet" href="style.css?v=20260923m">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){try{var t=localStorage.getItem('minera_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <div class="container wide">
        <header class="header-row">
            <div class="brand-title">
                <h1>Minera Pará</h1>
                <p id="user-label">Carregando...</p>
            </div>
            <button type="button" class="btn-sair" id="btn-sair">Sair</button>
        </header>
        <nav id="app-nav" class="nav-chips"></nav>

        <section class="mapa-native-card">
            <img src="logo-escavadeira.png?v=20260923m" alt="" width="96" height="96" style="margin-bottom:12px">
            <h2>Mapa nativo</h2>
            <p class="sub">O mapa abre no aplicativo do seu celular (Google Maps / Apple Maps). Não há mapa embutido nesta tela.</p>
            <button type="button" class="mapa-native-cta" id="btn-abrir-mapa-nativo">Abrir Parauapebas, PA</button>
            <p class="hint" style="margin-top:14px">Android: intent geo: · iOS: maps: · fallback web Google Maps</p>
        </section>
    </div>
    <script src="config.js?v=20260923m"></script>
    <script src="auth-guard.js?v=20260923m"></script>
    <script src="suporte.js?v=20260923m"></script>
    <script src="nav.js?v=20260923m"></script>
    <script src="mapa-native.js?v=20260923m"></script>
    <script src="pwa.js?v=20260923m"></script>
</body>
</html>
